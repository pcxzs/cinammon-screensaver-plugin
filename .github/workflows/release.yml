name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches debian/changelog
        run: |
          version=$(dpkg-parsechangelog -S Version)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper dh-python
          DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b
          mkdir -p dist && mv ../*.deb dist/
          cd dist && sha256sum *.deb > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --draft
